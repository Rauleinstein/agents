name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
        env:
          TMPDIR: ${{ runner.temp }}
      - run: python agentsctl.py --help
