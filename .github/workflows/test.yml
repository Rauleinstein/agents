name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        env:
          TMPDIR: ${{ runner.temp }}
      - run: node bin/agentsctl.js --help
      - run: npm pack --pack-destination "$RUNNER_TEMP"
